<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disparador WhatsApp</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .card { background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; }
    .status-ok { color: #4ade80; font-weight: bold; }
    .status-err { color: #f87171; font-weight: bold; }
    #debug-log { background: #000; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 6px; max-height: 200px; overflow-y: auto; color: #38bdf8; }
    button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>Disparador WhatsApp</h2>

  <div class="card">
    <div>Status do Servidor: <span id="server-status">Testando...</span></div>
    <div>WhatsApp: <span id="wa-status">Testando...</span></div>
  </div>

  <div class="card">
    <strong>Painel de Diagnóstico (Testes de Conexão)</strong>
    <pre id="debug-log">Iniciando testes no app...</pre>
    <button onclick="executarTestes()">Refazer Teste de Conexão</button>
  </div>

  <script>
    const LOG = document.getElementById('debug-log');
    function log(msg) {
      LOG.textContent += '\n' + new Date().toLocaleTimeString() + ' - ' + msg;
      LOG.scrollTop = LOG.scrollHeight;
    }

    async function testarEndpoint(url) {
      log('Tentando conectar em: ' + url);
      try {
        const res = await fetch(url, {
          method: 'GET',
          headers: { 'x-token': 'minhasenha' }
        });
        log('-> Resposta HTTP Status: ' + res.status);
        if (res.ok) {
          const data = await res.json();
          log('-> Sucesso! Resposta: ' + JSON.stringify(data));
          return data;
        }
      } catch (err) {
        log('-> ERRO DE REDE: ' + err.message);
      }
      return null;
    }

    async function executarTestes() {
      LOG.textContent = 'Iniciando diagnóstico...';
      
      // Teste 1: 127.0.0.1
      let res = await testarEndpoint('http://127.0.0.1:3000/status');
      
      // Teste 2: localhost
      if (!res) {
        log('Tentando via localhost...');
        res = await testarEndpoint('http://localhost:3000/status');
      }

      const elServer = document.getElementById('server-status');
      const elWa = document.getElementById('wa-status');

      if (res && res.ok) {
        elServer.className = 'status-ok';
        elServer.textContent = 'ONLINE (Porta 3000)';
        elWa.className = 'status-ok';
        elWa.textContent = res.whatsapp || 'Desconhecido';
      } else {
        elServer.className = 'status-err';
        elServer.textContent = 'FALHA DE CONEXÃO';
        elWa.className = 'status-err';
        elWa.textContent = 'INDISPONÍVEL';
      }
    }

    window.onload = executarTestes;
  </script>
</body>
</html>
