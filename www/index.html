<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Disparador WhatsApp</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #f8fafc; margin: 0; padding: 16px; }
    .card { background: #1e293b; padding: 16px; border-radius: 8px; margin-bottom: 12px; border: 1px solid #334155; }
    .status-ok { color: #4ade80; font-weight: bold; }
    .status-err { color: #f87171; font-weight: bold; }
    #debug-log { background: #000; font-family: monospace; font-size: 11px; padding: 10px; border-radius: 6px; max-height: 220px; overflow-y: auto; color: #38bdf8; }
    button { background: #2563eb; color: white; border: none; padding: 10px 16px; border-radius: 6px; font-weight: bold; width: 100%; margin-top: 8px; }
  </style>
</head>
<body>

  <h2>Disparador WhatsApp (Autônomo)</h2>

  <div class="card">
    <div>Servidor Embutido: <span id="server-status">Iniciando...</span></div>
    <div>WhatsApp: <span id="wa-status">Aguardando...</span></div>
  </div>

  <div class="card">
    <strong>Console de Inicialização</strong>
    <pre id="debug-log">Inicializando app autônomo...</pre>
    <button onclick="executarTestes()">Testar Conexão Novamente</button>
  </div>

  <script src="capacitor.js"></script>
  <script>
    const LOG = document.getElementById('debug-log');
    function log(msg) {
      LOG.textContent += '\n' + new Date().toLocaleTimeString() + ' - ' + msg;
      LOG.scrollTop = LOG.scrollHeight;
    }

    async function iniciarNodeJS() {
      if (window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorNodeJS) {
        log('Iniciando motor Node.js interno no APK...');
        try {
          await window.Capacitor.Plugins.CapacitorNodeJS.start();
          log('-> Motor Node.js iniciado com sucesso!');
        } catch (e) {
          log('-> Aviso ao iniciar Node.js: ' + e.message);
        }
      } else {
        log('Modo WebView / Termux detectado (CapacitorNodeJS ausente)');
      }
    }

    async function testarEndpoint(url) {
      log('Conectando em: ' + url);
      try {
        const res = await fetch(url, {
          method: 'GET',
          headers: { 'x-token': 'minhasenha' }
        });
        log('-> Status HTTP: ' + res.status);
        if (res.ok) {
          const data = await res.json();
          log('-> Resposta: ' + JSON.stringify(data));
          return data;
        }
      } catch (err) {
        log('-> Falha: ' + err.message);
      }
      return null;
    }

    async function executarTestes() {
      const elServer = document.getElementById('server-status');
      const elWa = document.getElementById('wa-status');

      // Tenta até 5 vezes aguardando o Node.js interno subir a porta 3000
      for (let i = 1; i <= 5; i++) {
        log(`Tentativa ${i}/5 de conexão com o servidor interno...`);
        let res = await testarEndpoint('https://disparador-fagundes.onrender.com/status');
        
        if (res && res.ok) {
          elServer.className = 'status-ok';
          elServer.textContent = 'ONLINE (Embutido)';
          elWa.className = 'status-ok';
          elWa.textContent = res.whatsapp || 'Conectado';
          return;
        }
        await new Promise(r => setTimeout(r, 2000));
      }

      elServer.className = 'status-err';
      elServer.textContent = 'ERRO AO INICIAR';
      elWa.className = 'status-err';
      elWa.textContent = 'INDISPONÍVEL';
    }

    window.onload = async () => {
      await iniciarNodeJS();
      setTimeout(executarTestes, 1500);
    };
  </script>
</body>
</html>
