/* Layout: one phone-width column; 3 tabs (Disparos, Histórico, Conexão) plus 2 pushed screens (Novo disparo, Escolher grupo). Dark-first utility look, WhatsApp-green accent. */
:root{
  --font-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --bg-outer:#080D0B;
  --bg:#0D1411;
  --surface:#16201B;
  --line:#26352D;
  --line-strong:#3A4D43;
  --fg:#EAF2EE;
  --muted:#93A89D;
  --accent:#2EE08A;
  --accent-ink:#06130C;
  --accent-text:#2EE08A;
  --accent-soft:rgba(46,224,138,.12);
  --line-accent:#1F4D39;
  --off-track:#2B3A32;
  --off-knob:#93A89D;
  --danger:#FF8A8A;
  --danger-soft:rgba(255,138,138,.12);
  color-scheme:dark;
}
@media (prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --bg-outer:#E4ECE7;--bg:#F4F8F5;--surface:#FFFFFF;--line:#D3E0D8;--line-strong:#A9BDB1;
    --fg:#12211A;--muted:#55695E;--accent:#0B7F47;--accent-ink:#FFFFFF;--accent-text:#0B7F47;
    --accent-soft:rgba(11,127,71,.10);--line-accent:#9CCDB4;--off-track:#C5D4CB;--off-knob:#FFFFFF;
    --danger:#B3261E;--danger-soft:rgba(179,38,30,.08);color-scheme:light;
  }
}
:root[data-theme="light"]{
  --bg-outer:#E4ECE7;--bg:#F4F8F5;--surface:#FFFFFF;--line:#D3E0D8;--line-strong:#A9BDB1;
  --fg:#12211A;--muted:#55695E;--accent:#0B7F47;--accent-ink:#FFFFFF;--accent-text:#0B7F47;
  --accent-soft:rgba(11,127,71,.10);--line-accent:#9CCDB4;--off-track:#C5D4CB;--off-knob:#FFFFFF;
  --danger:#B3261E;--danger-soft:rgba(179,38,30,.08);color-scheme:light;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-outer);color:var(--fg);font-family:var(--font-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h1,h2,p{margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
h2{font-size:16px;font-weight:700}
.sm{font-size:12px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){
  body{padding-block:16px}
  #app{border:1px solid var(--line);border-radius:28px;overflow:hidden}
}
.stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;padding:24px 20px 16px;display:flex;flex-direction:column;gap:16px}
.foot{flex:none;display:flex;gap:12px;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--bg)}
.bar{flex:none;display:flex;align-items:center;gap:4px;padding:16px 12px 4px}
.bar h1{flex:1;font-size:22px;letter-spacing:-.3px}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:12px}
.iconbtn.accent{color:var(--accent-text)}

.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent-text)}
.proto{font-size:12px;color:var(--muted);margin-top:-8px}
.next{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.next .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:var(--accent-text);font-variant-numeric:tabular-nums}
.next .lbl{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.next .nm{font-size:14px;font-weight:600;margin-top:4px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.card.off .card-title{color:var(--muted)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{min-height:44px;margin-block:-8px;padding:0;background:none;border:0;text-align:left;font-size:16px;font-weight:700}
.sw{flex:none;width:52px;height:44px;margin:-9px -6px -9px 0;padding:0;background:none;border:0;display:flex;align-items:center;justify-content:flex-end}
.track{width:44px;height:26px;padding:3px;border-radius:13px;background:var(--off-track);display:flex;align-items:center;justify-content:flex-start}
.knob{width:20px;height:20px;border-radius:50%;background:var(--off-knob)}
.sw[aria-pressed="true"] .track{background:var(--accent);justify-content:flex-end}
.sw[aria-pressed="true"] .knob{background:var(--accent-ink)}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.meta svg{flex:none}
.okt{color:var(--accent-text);font-weight:600}
.empty{padding:24px 16px;border-radius:18px;border:1px dashed var(--line-strong);text-align:center;color:var(--muted);font-size:14px;line-height:1.5}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;border:1.5px solid transparent;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.outline{background:none;border-color:var(--accent-text);color:var(--accent-text)}
.btn.ghost{background:none;border-color:var(--line-strong);color:var(--fg)}
.btn.small{min-height:44px;padding:0 16px;border-radius:12px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.foot .btn{flex:1}
.foot .btn.primary{flex:1.4}

.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl2{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=time],input[type=search],select{width:100%;height:48px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
input[type=file]{font-size:13px;max-width:100%}
.err{color:var(--danger);font-size:12px;font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.row input{flex:1;min-width:0}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 6px 0 14px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--line-accent);color:var(--accent-text);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:inherit;border-radius:50%}
.src{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1.5px solid var(--accent-text)}
.src .ttl{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.src .ttl svg{color:var(--accent-text)}
.epbox{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--bg);font-size:12px;color:var(--muted)}
.mono{font-family:var(--font-mono);min-width:0;overflow-wrap:anywhere;user-select:all}
.picker{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px;text-align:left}
.picker .l{display:flex;align-items:center;gap:12px;min-width:0}
.picker.ph{color:var(--muted)}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.gitem[aria-pressed="true"]{background:var(--accent-soft);border:1.5px solid var(--accent-text)}
.gitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:15px}
.gitem .t small{font-size:12px;font-weight:500;color:var(--muted)}
.tick{width:24px;height:24px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}

.hitem{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.hic{width:32px;height:32px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-text)}
.hic.bad{background:var(--danger-soft);color:var(--danger)}
.hitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hitem .t b{font-size:15px}
.hitem .t span{font-size:12px;color:var(--muted)}
.hitem .t .bad{color:var(--danger);font-weight:600}

.stat{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--line-accent)}
.stat .ic{width:48px;height:48px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
.box{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kv .mono{font-size:15px;font-weight:600}
.help{font-size:12px;line-height:1.5;color:var(--muted)}
.checks{display:flex;flex-direction:column;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.checks div{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:14px;font-weight:600}
.checks div+div{border-top:1px solid var(--line)}
.mini{width:24px;height:24px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center}
.qr svg{width:min(220px,100%);height:auto;border-radius:10px}

/* Estilo do Registrador de Log - Mantém padrão nativo */
.log-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  font-family:var(--font-mono);
  font-size:12px;
  line-height:1.6;
  max-height:160px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.log-entry{display:flex;gap:8px;word-break:break-all}
.log-time{color:var(--muted);flex:none}
.log-msg{color:var(--fg)}
.log-err{color:var(--danger);font-weight:600}
.log-ok{color:var(--accent-text)}

#nav{flex:none;display:flex;justify-content:space-around;padding:6px 12px 10px;border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;min-height:48px;padding:4px 8px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent-text);font-weight:700}
#toast{position:absolute;left:16px;right:16px;bottom:12px;z-index:5;padding:12px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>

  </nav>
</div>

  function nextSend() {
    var now = new Date(), best = null;
    state.dispatches.filter(function (d) { return d.active && d.mode === 'times'; }).forEach(function (d) {
      d.times.forEach(function (t) {
        var p = t.split(':').map(Number), c = new Date(now);
        c.setHours(p[0], p[1], 0, 0);
        if (c <= now) c.setDate(c.getDate() + 1);
        if (!best || c < best.at) best = { at: c, name: d.name, time: t };
      });
    });
    if (best) best.tomorrow = best.at.getDate() !== now.getDate();
    return best;
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    t.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function copyText(text) {
    var p;
    try { p = navigator.clipboard.writeText(text); } catch (e) { p = Promise.reject(e); }
    p.then(function () { toast('Copiado'); }, function () { toast('Não deu para copiar. Toque no texto para selecionar.'); });
  }

  /* ---------- renders ---------- */
  function renderNav() {
    var tabs = [['home', 'send', 'Disparos'], ['hist', 'list', 'Histórico'], ['conn', 'wifi', 'Conexão']];
    document.querySelectorAll('.tab').forEach(function (b, i) {
      b.innerHTML = ic(tabs[i][1], 22) + tabs[i][2];
      b.setAttribute('aria-current', state.screen === tabs[i][0] ? 'page' : 'false');
    });
  }

  function card(d) {
    var last = !d.active ? 'Pausado' : (d.last ? ic('check', 16, 2.5) + 'Enviado ' + d.last : 'Ainda não enviado');
    return '<article class="card' + (d.active ? '' : ' off') + '">' +
      '<div class="card-top"><button class="card-title" data-act="edit" data-id="' + d.id + '">' + esc(d.name) + '</button>' +
      '<button class="sw" data-act="toggle" data-id="' + d.id + '" aria-pressed="' + d.active + '" aria-label="' + (d.active ? 'Pausar ' : 'Ativar ') + esc(d.name) + '"><span class="track"><span class="knob"></span></span></button></div>' +
      '<div class="meta">' + ic('users', 16) + esc(d.group) + '</div>' +
      '<div class="meta">' + ic('clock', 16) + esc(schedText(d)) + ' · ' + (d.source === 'excel' ? 'Excel' : 'Arquivo manual') + '</div>' +
      '<div class="meta' + (d.active && d.last ? ' okt' : '') + '">' + last + '</div></article>';
  }

  function renderHome() {
    var n = nextSend(), act = state.dispatches.filter(function (d) { return d.active; }).length;
    var nextHtml = n
      ? '<div class="big">' + n.time + '</div><div><div class="lbl">Próximo envio · ' + (n.tomorrow ? 'amanhã' : 'hoje') + '</div><div class="nm">' + esc(n.name) + '</div></div>'
      : '<div><div class="lbl">Próximo envio</div><div class="nm">Nenhum horário agendado</div></div>';
    $('#s-home').innerHTML =
      '<div class="body">' +
      '<header class="top"><h1>Disparos</h1><span class="pill"><i class="dot"></i>WhatsApp conectado</span></header>' +
      '<p class="proto">Protótipo para testar a navegação. Nada é enviado de verdade.</p>' +
      '<div class="next">' + nextHtml + '</div>' +
      '<div class="sect"><h2>Meus disparos</h2><span class="muted sm">' + act + ' ativos de ' + state.dispatches.length + '</span></div>' +
      '<div class="cards">' + (state.dispatches.length ? state.dispatches.map(card).join('') : '<div class="empty">Nenhum disparo ainda. Toque em Novo disparo para criar o primeiro.</div>') + '</div>' +
      '</div>' +
      '<div class="foot"><button class="btn primary" data-act="new">' + ic('plus', 20, 2.5) + 'Novo disparo</button></div>';
  }

  function renderHist() {
    $('#s-hist').innerHTML =
      '<div class="body"><h1>Histórico</h1>' +
      '<p class="proto">Os envios abaixo são exemplos. Testes feitos no app aparecem no topo.</p>' +
      '<div class="cards">' + (state.history.length ? state.history.map(function (h) {
        return '<div class="hitem"><span class="hic' + (h.ok ? '' : ' bad') + '">' + ic(h.ok ? 'check' : 'alert', 16, 2.5) + '</span>' +
          '<div class="t"><b>' + esc(h.name) + '</b><span>' + esc(h.group) + ' · ' + esc(h.when) + '</span>' +
          (h.ok ? '<span>' + (h.test ? 'Teste simulado' : 'Entregue') + '</span>' : '<span class="bad">Falhou: ' + esc(h.err) + '</span>') + '</div></div>';
      }).join('') : '<div class="empty">Nenhum envio registrado ainda.</div>') + '</div></div>';
  }

  function qrSvg() {
    var n = 25, c = 8, pad = 2, seed = 11;
    var rnd = function () { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    var fin = function (x, y, ox, oy) {
      var dx = x - ox, dy = y - oy;
      return dx === 0 || dx === 6 || dy === 0 || dy === 6 || (dx >= 2 && dx <= 4 && dy >= 2 && dy <= 4);
    };
    var r = '';
    for (var y = 0; y < n; y++) {
      for (var x = 0; x < n; x++) {
        var on;
        if (x < 8 && y < 8) on = x < 7 && y < 7 && fin(x, y, 0, 0);
        else if (x >= n - 8 && y < 8) on = x >= n - 7 && y < 7 && fin(x, y, n - 7, 0);
        else if (x < 8 && y >= n - 8) on = x < 7 && y >= n - 7 && fin(x, y, 0, n - 7);
        else on = rnd() > 0.52;
        if (on) r += '<rect x="' + (x + pad) * c + '" y="' + (y + pad) * c + '" width="' + c + '" height="' + c + '"/>';
      }
    }
    var s = (n + pad * 2) * c;
    return '<svg viewBox="0 0 ' + s + ' ' + s + '" role="img" aria-label="QR code de exemplo"><rect width="' + s + '" height="' + s + '" fill="#fff"/><g fill="#111">' + r + '</g></svg>';
  }

  function renderConn() {
    var tok = state.tokenShown ? TOKEN : '••••-•••-••••';
    $('#s-conn').innerHTML =
      '<div class="body"><h1>Conexão</h1>' +
      '<div class="stat"><span class="ic">' + ic('check', 24, 2.5) + '</span><div><b>WhatsApp conectado</b><span>Funcionando há 3 dias, sem quedas (exemplo)</span></div></div>' +
      '<div class="box"><div class="lbl2" style="font-size:13px;font-weight:700;color:var(--muted)">Endereço para o Excel enviar</div>' +
      '<div class="kv"><span class="mono">' + IP + '</span><button class="btn primary small" data-act="copy" data-text="' + IP + '">Copiar</button></div>' +
      '<p class="help">Cole este endereço no código do Excel. O celular e o computador precisam estar no mesmo Wi-Fi.</p></div>' +
      '<div class="box"><div class="lbl2" style="font-size:13px;font-weight:700;color:var(--muted)">Senha de envio</div>' +
      '<div class="kv"><span class="mono">' + tok + '</span><span class="row"><button class="btn ghost small" data-act="tok">' + (state.tokenShown ? 'Ocultar' : 'Mostrar') + '</button><button class="btn primary small" data-act="copy" data-text="' + TOKEN + '">Copiar</button></span></div>' +
      '<p class="help">O Excel manda esta senha junto com o arquivo. Sem ela, o app recusa o envio.</p></div>' +
      '<div class="box"><div class="lbl2" style="font-size:13px;font-weight:700;color:var(--muted)">Registrador de Logs / Requisições</div>' +
      '<div class="log-box">' +
      (state.logs.length ? state.logs.map(function(l) {
        var cls = l.type === 'ok' ? 'log-ok' : (l.type === 'err' ? 'log-err' : 'log-msg');
        return '<div class="log-entry"><span class="log-time">' + l.time + '</span><span class="' + cls + '">' + esc(l.msg) + '</span></div>';
      }).join('') : '<div class="log-entry"><span class="log-msg">Nenhum evento registrado.</span></div>') +
      '</div></div>' +
      '<div class="box"><div class="lbl2" style="font-size:13px;font-weight:700;color:var(--muted)">Para o app não parar</div>' +
      '<div class="checks">' +
      ['Serviço em segundo plano ativo', 'Sem restrição de bateria', 'Conectado ao Wi-Fi'].map(function (t) { return '<div><span class="mini">' + ic('check', 14, 3.5) + '</span>' + t + '</div>'; }).join('') +
      '</div></div>' +
      '<div class="box"><div class="lbl2" style="font-size:13px;font-weight:700;color:var(--muted)">Trocar número do WhatsApp</div>' +
      '<button class="btn ghost block" data-act="qr">' + ic('qr', 20) + (state.qr ? 'Esconder QR code' : 'Ler novo QR code') + '</button>' +
      (state.qr ? '<div class="qr">' + qrSvg() + '<p class="help">QR de exemplo. No app de verdade, abra o WhatsApp, vá em Aparelhos conectados e escaneie este código.</p></div>' : '') +
      '</div></div>';
  }

  function renderNovo() {
    var d = state.draft, e = state.errors, edit = state.editingId !== null;
    var when = d.mode === 'times'
      ? '<div class="chips">' + d.times.map(function (t) {
          return '<span class="chip">' + t + '<button data-act="delTime" data-t="' + t + '" aria-label="Remover horário ' + t + '">' + ic('x', 14, 2.5) + '</button></span>';
        }).join('') + '</div>' +
        '<div class="row"><input type="time" id="newTime" data-field="newTime" value="' + esc(d.newTime) + '" aria-label="Novo horário"><button class="btn outline small" data-act="addTime">Adicionar</button></div>' +
        (e.times ? '<p class="err" role="alert">' + e.times + '</p>' : '')
      : '<select id="interval" data-field="interval" aria-label="Intervalo entre envios">' + INTERVALS.map(function (x) {
          return '<option value="' + x[0] + '"' + (d.interval === x[0] ? ' selected' : '') + '>A cada ' + x[1] + '</option>';
        }).join('') + '</select>';
    var url = 'http://' + IP + '/send/' + (slug(d.name) || 'novo-disparo');
    var source = d.source === 'excel'
      ? '<div class="src"><div class="ttl">' + ic('file', 20) + 'Recebido do Excel (automático)</div>' +
        '<div class="epbox"><span class="mono" id="ep">' + esc(url) + '</span><button class="btn primary small" id="epcopy" data-act="copy" data-text="' + esc(url) + '">Copiar</button></div></div>'
      : '<div class="src"><div class="ttl">' + ic('file', 20) + 'Arquivo escolhido manualmente</div><input type="file" id="file" accept="image/*,.pdf" aria-label="Escolher arquivo"></div>';
    $('#s-novo').innerHTML =
      '<div class="bar"><button class="iconbtn" data-act="back" aria-label="Voltar">' + ic('back', 24) + '</button><h1>' + (edit ? 'Editar disparo' : 'Novo disparo') + '</h1></div>' +
      '<div class="body">' +
      '<div class="field"><label for="nome">Nome do disparo</label><input type="text" id="nome" data-field="name" value="' + esc(d.name) + '" placeholder="Ex.: Relatório de Fim de Turno" autocomplete="off">' + (e.name ? '<p class="err" role="alert">' + e.name + '</p>' : '') + '</div>' +
      '<div class="field"><span class="lbl2">De onde vem o arquivo</span>' +
      '<div class="seg" role="group" aria-label="Origem do arquivo"><button data-act="source" data-v="excel" aria-pressed="' + (d.source === 'excel') + '">Excel</button><button data-act="source" data-v="manual" aria-pressed="' + (d.source === 'manual') + '">Manual</button></div>' + source + '</div>' +
      '<div class="field"><span class="lbl2">Enviar para o grupo</span>' +
      '<button class="picker' + (d.group ? '' : ' ph') + '" data-act="pickGroup"><span class="l">' + (d.group ? '<span class="avatar">' + esc(d.group.charAt(0)) + '</span>' + esc(d.group) : 'Escolher grupo') + '</span>' + ic('chev', 20) + '</button>' +
      (e.group ? '<p class="err" role="alert">' + e.group + '</p>' : '') + '</div>' +
      '<div class="field"><span class="lbl2">Quando enviar</span>' +
      '<div class="seg" role="group" aria-label="Tipo de agendamento"><button data-act="mode" data-v="times" aria-pressed="' + (d.mode === 'times') + '">Horários</button><button data-act="mode" data-v="interval" aria-pressed="' + (d.mode === 'interval') + '">A cada intervalo</button></div>' + when + '</div>' +
      '<div class="field"><label for="legenda">Legenda da imagem</label><input type="text" id="legenda" data-field="caption" value="' + esc(d.caption) + '" autocomplete="off"><p class="help">Use {data} e {hora} para preencher sozinhos.</p></div>' +
      (edit ? '<div class="field">' + (state.confirmDel
        ? '<p class="err">Excluir este disparo? Isso não pode ser desfeito.</p><div class="row"><button class="btn ghost small" data-act="delCancel">Cancelar</button><button class="btn danger small" data-act="delYes">Sim, excluir</button></div>'
        : '<button class="btn danger small" data-act="delAsk">Excluir disparo</button>') + '</div>' : '') +
      '</div>' +
      '<div class="foot"><button class="btn outline" data-act="test">Enviar teste</button><button class="btn primary" data-act="save">Salvar disparo</button></div>';
  }

  function renderGList() {
    var q = norm(state.q);
    var list = state.groups.filter(function (g) { return norm(g.name).indexOf(q) !== -1; });
    $('#gcount').textContent = list.length + (list.length === 1 ? ' grupo encontrado' : ' grupos encontrados') + ' no WhatsApp (exemplo)';
    $('#glist').innerHTML = list.length ? list.map(function (g) {
      var sel = state.draft && state.draft.group === g.name;
      return '<button class="gitem" data-act="setGroup" data-name="' + esc(g.name) + '" aria-pressed="' + !!sel + '"><span class="avatar">' + esc(g.name.charAt(0)) + '</span>' +
        '<span class="t">' + esc(g.name) + '<small>' + g.n + ' participantes</small></span>' + (sel ? '<span class="tick">' + ic('check', 14, 3.5) + '</span>' : '') + '</button>';
    }).join('') : '<div class="empty">Nenhum grupo com esse nome.</div>';
  }

  function renderGrupos() {
    $('#s-grupos').innerHTML =
      '<div class="bar"><button class="iconbtn" data-act="back" aria-label="Voltar">' + ic('back', 24) + '</button><h1>Escolher grupo</h1>' +
      '<button class="iconbtn accent" data-act="refresh" aria-label="Atualizar lista de grupos">' + ic('refresh', 22) + '</button></div>' +
      '<div class="body"><div class="field"><label class="sr" for="q">Buscar grupo</label><input type="search" id="q" data-field="q" placeholder="Buscar grupo" value="' + esc(state.q) + '" autocomplete="off"></div>' +
      '<p class="muted sm" id="gcount"></p><div class="glist" id="glist"></div></div>';
    renderGList();
  }

  var RENDER = { home: renderHome, hist: renderHist, conn: renderConn, novo: renderNovo, grupos: renderGrupos };

  function show(name) {
    state.screen = name;
    document.querySelectorAll('.screen').forEach(function (s) { s.hidden = s.id !== 's-' + name; });
    $('#nav').hidden = ['home', 'hist', 'conn'].indexOf(name) === -1;
    RENDER[name]();
    renderNav();
    var b = $('#s-' + name + ' .body');
    if (b) b.scrollTop = 0;
  }

  /* ---------- actions ---------- */
  function openDraft(id) {
    state.editingId = id;
    state.errors = {};
    state.confirmDel = false;
    var src = id === null ? null : state.dispatches.filter(function (d) { return d.id === id; })[0];
    state.draft = src
      ? Object.assign({}, src, { times: src.times.slice(), newTime: '' })
      : { name: '', group: '', mode: 'times', times: [], interval: 120, source: 'excel', caption: 'Relatório · {data} {hora}', newTime: '', active: true, last: '' };
    show('novo');
  }

  var A = {
    tab: function (t) { show(t.dataset.tab); },
    new: function () { openDraft(null); },
    edit: function (t) { openDraft(Number(t.dataset.id)); },
    toggle: function (t) {
      var d = state.dispatches.filter(function (x) { return x.id === Number(t.dataset.id); })[0];
      d.active = !d.active;
      renderHome();
      toast(d.active ? 'Disparo ativado' : 'Disparo pausado');
      addLog('Disparo "' + d.name + '" ' + (d.active ? 'ativado' : 'pausado'), 'normal');
    },
    back: function () { show(state.screen === 'grupos' ? 'novo' : 'home'); },
    pickGroup: function () { state.q = ''; show('grupos'); },
    setGroup: function (t) { state.draft.group = t.dataset.name; delete state.errors.group; show('novo'); },
    refresh: function () { toast('Lista de grupos atualizada'); addLog('Busca de grupos atualizada via WhatsApp', 'normal'); },
    source: function (t) { state.draft.source = t.dataset.v; renderNovo(); },
    mode: function (t) { state.draft.mode = t.dataset.v; delete state.errors.times; renderNovo(); },
    addTime: function () {
      var d = state.draft, v = d.newTime;
      if (!/^\d{2}:\d{2}$/.test(v)) { state.errors.times = 'Escolha um horário válido.'; renderNovo(); return; }
      if (d.times.indexOf(v) !== -1) { state.errors.times = 'Esse horário já está na lista.'; renderNovo(); return; }
      d.times.push(v); d.times.sort(); d.newTime = ''; delete state.errors.times;
      renderNovo();
    },
    delTime: function (t) { state.draft.times = state.draft.times.filter(function (x) { return x !== t.dataset.t; }); renderNovo(); },
    test: function () {
      var d = state.draft;
      if (!d.group) { state.errors.group = 'Escolha o grupo para fazer o teste.'; renderNovo(); return; }
      state.history.unshift({ name: d.name.trim() || 'Disparo sem nome', group: d.group, when: nowLabel(), ok: true, test: true });
      toast('Teste registrado no Histórico (simulação)');
      addLog('POST /send/' + (slug(d.name) || 'teste') + ' 200 OK (Simulado)', 'ok');
    },
    save: function () {
      var d = state.draft, e = {};
      if (!d.name.trim()) e.name = 'Dê um nome ao disparo.';
      if (!d.group) e.group = 'Escolha o grupo que vai receber.';
      if (d.mode === 'times' && d.times.length === 0) e.times = 'Adicione pelo menos um horário.';
      if (Object.keys(e).length) { state.errors = e; renderNovo(); $('#s-novo .body').scrollTop = 0; return; }
      var rec = { id: state.editingId !== null ? state.editingId : state.nextId++, name: d.name.trim(), group: d.group, mode: d.mode, times: d.times.slice(), interval: d.interval, source: d.source, caption: d.caption, active: d.active, last: d.last };
      if (state.editingId !== null) {
        state.dispatches = state.dispatches.map(function (x) { return x.id === rec.id ? rec : x; });
      } else {
        state.dispatches.push(rec);
      }
      show('home');
      toast('Disparo salvo');
      addLog('Configuração do disparo "' + rec.name + '" salva', 'normal');
    },
    delAsk: function () { state.confirmDel = true; renderNovo(); },
    delCancel: function () { state.confirmDel = false; renderNovo(); },
    delYes: function () {
      var name = state.draft.name;
      state.dispatches = state.dispatches.filter(function (x) { return x.id !== state.editingId; });
      show('home');
      toast('Disparo excluído');
      addLog('Disparo "' + name + '" removido', 'err');
    },
    copy: function (t) { copyText(t.dataset.text); addLog('Copiado para área de transferência: ' + t.dataset.text, 'normal'); },
    tok: function () { state.tokenShown = !state.tokenShown; renderConn(); },
    qr: function () { state.qr = !state.qr; renderConn(); addLog(state.qr ? 'Solicitada leitura de QR Code' : 'QR Code ocultado', 'normal'); }
  };

  document.addEventListener('click', function (ev) {
    var t = ev.target.closest('[data-act]');
    if (t && A[t.dataset.act]) A[t.dataset.act](t);
  });

  document.addEventListener('input', function (ev) {
    var f = ev.target.dataset && ev.target.dataset.field;
    if (!f) return;
    if (f === 'q') { state.q = ev.target.value; renderGList(); return; }
    if (!state.draft) return;
    state.draft[f] = f === 'interval' ? Number(ev.target.value) : ev.target.value;
    if (f === 'name') {
      var url = 'http://' + IP + '/send/' + (slug(state.draft.name) || 'novo-disparo');
      var ep = $('#ep'), cp = $('#epcopy');
      if (ep) ep.textContent = url;
      if (cp) cp.dataset.text = url;
    }
  });

  show('home');
})();
</script>

</body></html>
