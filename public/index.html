
<!doctype html>
<html>
<head>
<meta charset="utf8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Disparador WhatsApp</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://googleapis.com">
<style>
:root{
  --font-ui:'Plus Jakarta Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:ui-monospace,'SF Mono',Menlo,Consolas,monospace;
  --bg-outer:#080D0B;
  --bg:#0D1411;
  --surface:#16201B;
  --line:#26352D;
  --line-strong:#3A4D43;
  --fg:#EAF2EE;
  --muted:#93A89D;
  --accent:#2EE08A;
  --accent-ink:#06130C;
  --accent-text:#2EE08A;
  --accent-soft:rgba(46,224,138,.12);
  --line-accent:#1F4D39;
  --off-track:#2B3A32;
  --off-knob:#93A89D;
  --danger:#FF8A8A;
  --danger-soft:rgba(255,138,138,.12);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;background:var(--bg-outer);color:var(--fg);font-family:var(--font-ui);font-size:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-text);outline-offset:2px}
h1,h2,p{margin:0}
h1{font-size:28px;font-weight:800;letter-spacing:-.5px}
h2{font-size:16px;font-weight:700}
.sm{font-size:12px}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
#app{height:100%;max-width:440px;margin:0 auto;display:flex;flex-direction:column;background:var(--bg)}
@media (min-width:520px){
  body{padding-block:16px}
  #app{border:1px solid var(--line);border-radius:28px;overflow:hidden}
}
.stage{flex:1;min-height:0;position:relative}
.screen{position:absolute;inset:0;display:flex;flex-direction:column}
.body{flex:1;min-height:0;overflow-y:auto;padding:24px 20px 16px;display:flex;flex-direction:column;gap:16px}
.foot{flex:none;display:flex;gap:12px;padding:12px 20px 16px;border-top:1px solid var(--line);background:var(--bg)}
.bar{flex:none;display:flex;align-items:center;gap:4px;padding:16px 12px 4px}
.bar h1{flex:1;font-size:22px;letter-spacing:-.3px}
.iconbtn{width:44px;height:44px;display:flex;align-items:center;justify-content:center;background:none;border:0;border-radius:12px}
.iconbtn.accent{color:var(--accent-text)}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;padding:8px 12px;border-radius:999px;background:var(--accent-soft);color:var(--accent-text);font-size:12px;font-weight:700}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent-text)}
.proto{font-size:12px;color:var(--muted);margin-top:-8px}
.next{display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.next .big{font-size:44px;font-weight:800;letter-spacing:-1.5px;line-height:1;color:var(--accent-text);font-variant-numeric:tabular-nums}
.next .lbl{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase}
.next .nm{font-size:14px;font-weight:600;margin-top:4px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.cards{display:flex;flex-direction:column;gap:12px}
.card{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:18px;background:var(--surface);border:1px solid var(--line)}
.card.off .card-title{color:var(--muted)}
.card-top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-title{min-height:44px;margin-block:-8px;padding:0;background:none;border:0;text-align:left;font-size:16px;font-weight:700}
.sw{flex:none;width:52px;height:44px;margin:-9px -6px -9px 0;padding:0;background:none;border:0;display:flex;align-items:center;justify-content:flex-end}
.track{width:44px;height:26px;padding:3px;border-radius:13px;background:var(--off-track);display:flex;align-items:center;justify-content:flex-start}
.knob{width:20px;height:20px;border-radius:50%;background:var(--off-knob)}
.sw[aria-pressed="true"] .track{background:var(--accent);justify-content:flex-end}
.sw[aria-pressed="true"] .knob{background:var(--accent-ink)}
.meta{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.meta svg{flex:none}
.okt{color:var(--accent-text);font-weight:600}
.empty{padding:24px 16px;border-radius:18px;border:1px dashed var(--line-strong);text-align:center;color:var(--muted);font-size:14px;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 20px;border-radius:16px;border:1.5px solid transparent;font-weight:800;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.outline{background:none;border-color:var(--accent-text);color:var(--accent-text)}
.btn.ghost{background:none;border-color:var(--line-strong);color:var(--fg)}
.btn.small{min-height:44px;padding:0 16px;border-radius:12px;font-size:13px}
.btn.block{width:100%}
.btn.danger{background:none;border-color:var(--danger);color:var(--danger)}
.foot .btn{flex:1}
.foot .btn.primary{flex:1.4}
.field{display:flex;flex-direction:column;gap:8px}
.field>label,.lbl2{font-size:13px;font-weight:700;color:var(--muted)}
input[type=text],input[type=time],input[type=search],select{width:100%;height:48px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-size:15px}
input[type=file]{font-size:13px;max-width:100%}
.err{color:var(--danger);font-size:12px;font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.row input{flex:1;min-width:0}
.seg{display:flex;padding:4px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.seg button{flex:1;min-height:40px;border:0;border-radius:10px;background:none;color:var(--muted);font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:800}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;align-items:center;gap:2px;min-height:40px;padding:0 6px 0 14px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--line-accent);color:var(--accent-text);font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.chip button{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border:0;background:none;color:inherit;border-radius:50%}
.src{display:flex;flex-direction:column;gap:10px;padding:14px 16px;border-radius:14px;background:var(--accent-soft);border:1.5px solid var(--accent-text)}
.src .ttl{display:flex;align-items:center;gap:10px;font-size:15px;font-weight:700}
.src .ttl svg{color:var(--accent-text)}
.epbox{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 8px 8px 12px;border-radius:10px;background:var(--bg);font-size:12px;color:var(--muted)}
.mono{font-family:var(--font-mono);min-width:0;overflow-wrap:anywhere;user-select:all}
.picker{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;min-height:52px;padding:0 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:15px;text-align:left}
.picker .l{display:flex;align-items:center;gap:12px;min-width:0}
.picker.ph{color:var(--muted)}
.avatar{width:36px;height:36px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center;font-weight:800}
.glist{display:flex;flex-direction:column;gap:8px}
.gitem{display:flex;align-items:center;gap:12px;width:100%;min-height:60px;padding:8px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:left}
.gitem[aria-pressed="true"]{background:var(--accent-soft);border:1.5px solid var(--accent-text)}
.gitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;font-weight:700;font-size:15px}
.gitem .t small{font-size:12px;font-weight:500;color:var(--muted)}
.tick{width:24px;height:24px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.hitem{display:flex;align-items:flex-start;gap:12px;padding:14px 16px;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.hic{width:32px;height:32px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent-text)}
.hic.bad{background:var(--danger-soft);color:var(--danger)}
.hitem .t{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.hitem .t b{font-size:15px}
.hitem .t span{font-size:12px;color:var(--muted)}
.hitem .t .bad{color:var(--danger);font-weight:600}
.stat{display:flex;align-items:center;gap:14px;padding:18px;border-radius:20px;background:var(--accent-soft);border:1px solid var(--line-accent)}
.stat .ic{width:48px;height:48px;flex:none;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center}
.stat b{display:block;font-size:18px;font-weight:800}
.stat span{font-size:13px;color:var(--muted)}
.box{display:flex;flex-direction:column;gap:10px}
.kv{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 10px 10px 16px;border-radius:14px;background:var(--surface);border:1px solid var(--line)}
.kv .mono{font-size:15px;font-weight:600}
.help{font-size:12px;line-height:1.5;color:var(--muted)}
.checks{display:flex;flex-direction:column;border-radius:16px;background:var(--surface);border:1px solid var(--line)}
.checks div{display:flex;align-items:center;gap:12px;padding:14px 16px;font-size:14px;font-weight:600}
.checks div+div{border-top:1px solid var(--line)}
.mini{width:24px;height:24px;flex:none;border-radius:50%;background:var(--accent-soft);color:var(--accent-text);display:flex;align-items:center;justify-content:center}
.qr{display:flex;flex-direction:column;align-items:center;gap:12px;padding:16px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-align:center}
.qr img{width:min(220px,100%);height:auto;border-radius:10px}
.log-box{
  background:var(--surface);
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 14px;
  font-family:var(--font-mono);
  font-size:12px;
  line-height:1.6;
  max-height:160px;
  overflow-y:auto;
  display:flex;
  flex-direction:column;
  gap:6px;
}
.log-entry{display:flex;gap:8px;word-break:break-all}
.log-time{color:var(--muted);flex:none}
.log-msg{color:var(--fg)}
.log-err{color:var(--danger);font-weight:600}
.log-ok{color:var(--accent-text)}
#nav{flex:none;display:flex;justify-content:space-around;padding:6px 12px 10px;border-top:1px solid var(--line);background:var(--bg)}
.tab{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:72px;min-height:48px;padding:4px 8px;background:none;border:0;color:var(--muted);font-size:11px;font-weight:600}
.tab[aria-current="page"]{color:var(--accent-text);font-weight:700}
#toast{position:absolute;left:16px;right:16px;bottom:12px;z-index:5;padding:12px 16px;border-radius:12px;background:var(--fg);color:var(--bg);font-size:13px;font-weight:600;text-align:center;opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s}
#toast.show{opacity:1;transform:none}
</style>
</head>
<body>
<div id="app">
  <div class="stage">
    <div id="s-home" class="screen"></div>
    <div id="s-hist" class="screen" hidden></div>
    <div id="s-conn" class="screen" hidden></div>
    <div id="s-novo" class="screen" hidden></div>
    <div id="s-grupos" class="screen" hidden></div>
  </div>
  <nav id="nav"></nav>
  <div id="toast"></div>
</div>

<script>
(function () {
var $ = function (s, r) { return (r || document).querySelector(s); };
var esc = function (s) {
  return String(s).replace(/[&<>"']/g, function (c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
  });
};
var norm = function (s) { return String(s).normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); };
var slug = function (s) { return norm(s).replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, ''); };

var BACKEND_URL = 'http://localhost:3000';
var TOKEN = window.ANDROID_TOKEN || 'k7Qx-92mf-LpT4';

var state = {
  screen: 'home',
  waStatus: 'verificando',
  qrImage: null,
  groups: [],
  dispatches: [],
  history: [],
  logs: [],
  draft: null, editingId: null, errors: {}, confirmDel: false, q: '', tokenShown: false, qr: false, nextId: 1
};

var I = {
  send: '', list: '', wifi: '', back: '', chev: '', plus: '', clock: '', users: '', file: '', check: '', refresh: '', copy: '', x: '', alert: '', qr: ''
};
var ic = function (n, s, sw) {
  return '<span class="mini">' + (I[n] || '') + '</span>';
};

var pad2 = function (n) { return (n < 10 ? '0' : '') + n; };
var timeNow = function () { var d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()); };

function addLog(msg, type) {
  state.logs.unshift({ time: timeNow(), msg: msg, type: type || 'normal' });
  if (state.logs.length > 50) state.logs.pop();
  if (state.screen === 'conn') renderConn();
}

async function api(path, options) {
  options = options || {};
  options.headers = options.headers || {};
  options.headers['x-token'] = TOKEN;
  options.headers['Content-Type'] = 'application/json';
  try {
    var res = await fetch(BACKEND_URL + path, options);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.json();
  } catch (e) {
    addLog('Erro API (' + path + '): ' + e.message, 'err');
    throw e;
  }
}

async function pollBackendData() {
  try {
    var data = await api('/status');
    state.waStatus = data.whatsapp || 'conectado';
    state.qrImage = data.qr || null;
    if (data.groups) state.groups = data.groups;
    if (data.dispatches) {
      state.dispatches = data.dispatches.map(function(d) {
        return {
          id: d.id || slug(d.name),
          name: d.name,
          group: d.groupName || d.group,
          mode: d.schedType === 'interval' ? 'interval' : 'times',
          times: d.schedType === 'times' ? (Array.isArray(d.schedValue) ? d.schedValue : [d.schedValue]) : [],
          interval: d.schedType === 'interval' ? Number(d.schedValue) || 120 : 120,
          source: 'excel',
          caption: d.caption || '',
          active: d.active !== false,
          last: d.lastRun || ''
        };
      });
    }
    addLog('GET /status 200 OK - Sincronizado', 'ok');
  } catch (e) {
    state.waStatus = 'offline';
    addLog('Falha ao comunicar com o backend local', 'err');
  }
  if (['conn', 'home'].indexOf(state.screen) !== -1) RENDER[state.screen]();
}
setInterval(pollBackendData, 4000);
pollBackendData();

var INTERVALS = [[15, '15 minutos'], [30, '30 minutos'], [60, '1 hora'], [120, '2 horas'], [240, '4 horas'], [360, '6 horas']];
var intervalText = function (m) { var f = INTERVALS.filter(function (x) { return x[0] === m; })[0]; return f ? f[1] : m + ' minutos'; };
var joinList = function (a) { return a.length <= 1 ? (a[0] || '') : a.slice(0, -1).join(', ') + ' e ' + a[a.length - 1]; };
var schedText = function (d) {
  if (d.mode === 'interval') return 'A cada ' + intervalText(d.interval);
  return d.times.length ? 'Todo dia às ' + joinList(d.times) : 'Sem horários';
};

function toast(msg) {
  var t = $('#toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(function () { t.classList.remove('show'); }, 2600);
}

function copyText(text) {
  navigator.clipboard.writeText(text).then(function () { toast('Copiado'); });
}

function renderNav() {
  var tabs = [['home', 'send', 'Disparos'], ['hist', 'list', 'Histórico'], ['conn', 'wifi', 'Conexão']];
  document.querySelectorAll('.tab').forEach(function (b, i) {
    b.innerHTML = ic(tabs[i][1], 22) + tabs[i][2];
    b.setAttribute('aria-current', state.screen === tabs[i][0] ? 'page' : 'false');
  });
}

function card(d) {
  var last = !d.active ? 'Pausado' : (d.last ? ic('check', 16, 2.5) + 'Enviado ' + d.last : 'Ainda não enviado');
  return '<div class="card' + (!d.active ? ' off' : '') + '">' +
    '<div class="card-top"><button class="card-title" data-act="edit" data-id="' + d.id + '">' + esc(d.name) + '</button>' +
    '<button class="sw" aria-pressed="' + (d.active ? 'true' : 'false') + '" data-act="toggle" data-id="' + d.id + '"><span class="track"><span class="knob"></span></span></button></div>' +
    '<div class="meta">' + ic('users', 16) + esc(d.group) + '</div>' +
    '<div class="meta">' + ic('clock', 16) + esc(schedText(d)) + ' · Excel</div>' +
    '<div class="meta okt">' + last + '</div></div>';
}

function renderHome() {
  var act = state.dispatches.filter(function (d) { return d.active; }).length;
  var waText = state.waStatus === 'open' ? 'WhatsApp conectado' : 'WhatsApp aguardando QR';
  $('#s-home').innerHTML = '<div class="screen">' +
    '<div class="bar"><h1>Disparor</h1><span class="pill"><span class="dot"></span>' + waText + '</span></div>' +
    '<div class="body"><p class="proto">Backend Node.js nativo ativo na porta 3000.</p>' +
    '<div class="sect"><h2>Meus disparos</h2><span class="muted">' + act + ' ativos de ' + state.dispatches.length + '</span></div>' +
    '<div class="cards">' + (state.dispatches.length ? state.dispatches.map(card).join('') : '<div class="empty">Nenhum disparo configurado no servidor.</div>') + '</div></div>' +
    '<div class="foot"><button class="btn primary block" data-act="new">' + ic('plus', 20, 2.5) + 'Novo disparo</button></div></div>';
}

function renderHist() {
  $('#s-hist').innerHTML = '<div class="screen">' +
    '<div class="bar"><h1>Histórico</h1></div>' +
    '<div class="body"><div class="cards">' + (state.history.length ? state.history.map(function (h) {
      return '<div class="hitem"><div class="hic' + (h.ok ? '' : ' bad') + '">' + ic(h.ok ? 'check' : 'alert', 16, 2.5) + '</div>' +
        '<div class="t"><b>' + esc(h.name) + '</b><span>' + esc(h.group) + ' · ' + esc(h.when) + '</span>' +
        (h.ok ? '<span class="okt">Entregue</span>' : '<span class="bad">Falhou: ' + esc(h.err) + '</span>') + '</div></div>';
    }).join('') : '<div class="empty">Nenhum envio recente registrado.</div>') + '</div></div></div>';
}

function renderConn() {
  var tok = state.tokenShown ? TOKEN : '••••-•••-••••';
  var ipPort = 'localhost:3000';
  var waStatusBadge = state.waStatus === 'open' ? 'Conectado e Operacional' : 'Necessita leitura de QR Code';
  $('#s-conn').innerHTML = '<div class="screen">' +
    '<div class="bar"><h1>Conexão</h1></div>' +
    '<div class="body"><div class="stat"><div class="ic">' + ic('wifi', 24, 2.5) + '</div><div><b>Status: ' + waStatusBadge + '</b><span>Motor Baileys rodando localmente no APK</span></div></div>' +
    '<div class="field"><label>Endereço local interno</label><div class="row"><input type="text" value="' + ipPort + '" readonly class="mono"><button class="btn ghost small" data-act="copy" data-text="' + ipPort + '">Copiar</button></div></div>' +
    '<div class="field"><label>Senha de Token de Acesso</label><div class="row"><input type="text" value="' + tok + '" readonly class="mono"><button class="btn ghost small" data-act="tok">' + (state.tokenShown ? 'Ocultar' : 'Mostrar') + '</button><button class="btn ghost small" data-act="copy" data-text="' + TOKEN + '">Copiar</button></div></div>' +
    '<div class="field"><label>Registrador de Logs / Requisições Reais</label><div class="log-box">' +
    (state.logs.length ? state.logs.map(function(l) {
      var cls = l.type === 'ok' ? 'log-ok' : (l.type === 'err' ? 'log-err' : 'log-msg');
      return '<div class="log-entry"><span class="log-time">[' + l.time + ']</span><span class="' + cls + '">' + esc(l.msg) + '</span></div>';
    }).join('') : '<div class="muted">Aguardando requisições...</div>') +
    '</div></div>' +
    '<div class="field"><label>Pareamento WhatsApp</label><button class="btn danger block" data-act="logout">Desconectar e Ler Novo QR Code</button></div>' +
    (state.qr ? '<div class="qr"><button class="btn ghost small" data-act="qr">Esconder QR Code</button>' + (state.qrImage ? '<img src="' + state.qrImage + '" alt="QR Code WhatsApp">' : '<span class="muted">A carregar QR Code do servidor...</span>') + '</div>' : '') +
    '</div></div>';
}

function renderNovo() {
  var d = state.draft, e = state.errors, edit = state.editingId !== null;
  var when = d.mode === 'times'
    ? '<div class="chips">' + d.times.map(function (t) {
        return '<span class="chip">' + t + '<button data-act="delTime" data-t="' + t + '">' + ic('x', 14, 2.5) + '</button></span>';
      }).join('') + '</div>' +
      '<div class="row"><input type="time" data-field="newTime" value="' + (d.newTime || '') + '"><button class="btn outline small" data-act="addTime">Adicionar</button></div>' +
      (e.times ? '<span class="err">' + e.times + '</span>' : '')
    : '<select data-field="interval">' + INTERVALS.map(function (x) {
        return '<option value="' + x[0] + '"' + (d.interval === x[0] ? ' selected' : '') + '>A cada ' + x[1] + '</option>';
      }).join('') + '</select>';
  var url = BACKEND_URL + '/send/' + (slug(d.name) || 'novo-disparo');
  $('#s-novo').innerHTML = '<div class="screen">' +
    '<div class="bar"><button class="iconbtn" data-act="back">' + ic('back', 24) + '</button><h1>' + (edit ? 'Editar disparo' : 'Novo disparo') + '</h1></div>' +
    '<div class="body"><div class="field"><label>Nome do disparo</label><input type="text" data-field="name" value="' + esc(d.name || '') + '" placeholder="Ex: Promoção Dia das Mães"></div>' +
    '<div class="field"><label>Endpoint Gerado</label><div class="epbox"><span class="mono">' + esc(url) + '</span><button class="btn ghost small" data-act="copy" data-text="' + url + '">Copiar</button></div></div>' +
    '<div class="field"><label>Enviar para o grupo</label><button class="picker" data-act="pickGroup"><span class="l"><span class="avatar">' + (d.group ? d.group[0].toUpperCase() : '#') + '</span><span>' + (d.group ? esc(d.group) : 'Escolher grupo') + '</span></span>' + ic('chev', 20) + '</button></div>' +
    '<div class="field"><label>Quando enviar</label><div class="seg"><button data-act="mode" data-v="times" aria-pressed="' + (d.mode === 'times' ? 'true' : 'false') + '">Horários</button><button data-act="mode" data-v="interval" aria-pressed="' + (d.mode === 'interval' ? 'true' : 'false') + '">Intervalo</button></div>' + when + '</div>' +
    '</div><div class="foot"><button class="btn ghost" data-act="test">Testar</button><button class="btn primary" data-act="save">Salvar</button></div></div>';
}

function renderGrupos() {
  $('#s-grupos').innerHTML = '<div class="screen">' +
    '<div class="bar"><button class="iconbtn" data-act="back">' + ic('back', 24) + '</button><h1>Escolher grupo</h1></div>' +
    '<div class="body"><div class="glist">' + (state.groups.length ? state.groups.map(function(g){
      return '<button class="gitem" data-act="setGroup" data-name="' + esc(g.name) + '"><span class="avatar">' + g.name[0].toUpperCase() + '</span><span class="t"><b>' + esc(g.name) + '</b><small>' + (g.participants || 0) + ' membros</small></span></button>';
    }).join('') : '<div class="empty">Nenhum grupo sincronizado ainda pelo Baileys.</div>') + '</div></div></div>';
}

var RENDER = { home: renderHome, hist: renderHist, conn: renderConn, novo: renderNovo, grupos: renderGrupos };

function show(name) {
  state.screen = name;
  document.querySelectorAll('.screen').forEach(function (s) { s.hidden = s.id !== 's-' + name; });
  $('#nav').hidden = ['home', 'hist', 'conn'].indexOf(name) === -1;
  RENDER[name]();
  renderNav();
}

var A = {
  tab: function (t) { show(t.dataset.tab); },
  new: function () {
    state.draft = { name: '', group: '', mode: 'times', times: [], interval: 120, source: 'excel', caption: '', newTime: '', active: true };
    state.editingId = null;
    show('novo');
  },
  back: function () { show(state.screen === 'grupos' ? 'novo' : 'home'); },
  pickGroup: function () { show('grupos'); },
  setGroup: function (t) { state.draft.group = t.dataset.name; show('novo'); },
  mode: function (t) { state.draft.mode = t.dataset.v; renderNovo(); },
  addTime: function () {
    var v = state.draft.newTime;
    if (v && state.draft.times.indexOf(v) === -1) { state.draft.times.push(v); state.draft.times.sort(); state.draft.newTime = ''; renderNovo(); }
  },
  delTime: function (t) { state.draft.times = state.draft.times.filter(function (x) { return x !== t.dataset.t; }); renderNovo(); },
  save: async function () {
    var d = state.draft;
    var payload = {
      name: d.name,
      groupName: d.group,
      schedType: d.mode === 'interval' ? 'interval' : 'times',
      schedValue: d.mode === 'interval' ? d.interval : d.times,
      caption: d.caption,
      active: d.active
    };
    try {
      await api('/send/' + (slug(d.name) || 'novo'), { method: 'POST', body: JSON.stringify(payload) });
      addLog('Disparo salvo com sucesso: ' + d.name, 'ok');
      toast('Salvo com sucesso no servidor');
      pollBackendData();
      show('home');
    } catch (e) {
      toast('Erro ao salvar no servidor');
    }
  },
  toggle: async function (t) {
    var id = t.dataset.id;
    var d = state.dispatches.filter(function (x) { return x.id == id; })[0];
    if (!d) return;
    d.active = !d.active;
    var payload = {
      name: d.name,
      groupName: d.group,
      schedType: d.mode,
      schedValue: d.mode === 'interval' ? d.interval : d.times,
      active: d.active
    };
    try {
      await api('/send/' + slug(d.name), { method: 'POST', body: JSON.stringify(payload) });
      addLog('Status alterado para: ' + (d.active ? 'Ativo' : 'Pausado'), 'ok');
      renderHome();
    } catch (e) {
      toast('Erro ao atualizar status');
    }
  },
  test: async function () {
    try {
      addLog('POST /test - Enviando teste manual...', 'normal');
      var res = await api('/test', { method: 'POST' });
      toast('Teste acionado com sucesso!');
      addLog('POST /test 200 OK', 'ok');
    } catch (e) {
      toast('Falha na rota de teste.');
    }
  },
  copy: function (t) { copyText(t.dataset.text); },
  tok: function () { state.tokenShown = !state.tokenShown; renderConn(); },
  logout: async function () {
    if (!confirm('Tem certeza que deseja desconectar o WhatsApp atual?')) return;
    try {
      await api('/reset-session', { method: 'POST' });
      toast('Desconectado! Aguarde a geração do novo QR Code...');
      state.qr = true;
      state.waStatus = 'aguardando';
      renderConn();
    } catch (e) {
      toast('Erro ao tentar desconectar.');
    }
  },
  qr: function () { state.qr = !state.qr; renderConn(); }
};

document.addEventListener('click', function (ev) {
  var t = ev.target.closest('[data-act]');
  if (t && A[t.dataset.act]) A[t.dataset.act](t);
});

document.addEventListener('input', function (ev) {
  var f = ev.target.dataset && ev.target.dataset.field;
  if (f && state.draft) state.draft[f] = ev.target.value;
});

show('home');
})();
</script>
</body>
</html>
