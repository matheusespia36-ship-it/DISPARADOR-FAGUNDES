name: Compilar APK Autonomo Local (Node.js Embutido)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Baixar Binario Node.js ARM64 Nativo para Android
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          sudo apt-get update && sudo apt-get install -y zstd binutils python3

          python3 -c '
import urllib.request
import gzip
import re
import sys

mirrors = [
    "https://packages-cf.termux.dev/apt/termux-main/",
    "https://mirrors.tuna.tsinghua.edu.cn/termux/apt/termux-main/",
    "https://grimler.es/termux-packages-24/"
]

pkg_path = None
base_used = ""

for base in mirrors:
    try:
        url = base + "dists/stable/main/binary-aarch64/Packages.gz"
        print(f"Tentando indice: {url}")
        req = urllib.request.Request(url, headers={"User-Agent": "Mozilla/5.0"})
        with urllib.request.urlopen(req, timeout=15) as resp:
            content = gzip.decompress(resp.read()).decode("utf-8", errors="ignore")
            
        blocks = content.split("\n\n")
        for block in blocks:
            if re.search(r"^Package:\s*(nodejs|nodejs-lts)$", block, re.MULTILINE):
                m = re.search(r"^Filename:\s*(.+)$", block, re.MULTILINE)
                if m:
                    pkg_path = m.group(1).strip()
                    base_used = base
                    break
        if pkg_path:
            break
    except Exception as e:
        print(f"Falha no mirror {base}: {e}")

if not pkg_path:
    print("Nenhum pacote Node.js encontrado nos mirrors.")
    sys.exit(1)

deb_url = base_used + pkg_path
print(f"Baixando pacote oficial: {deb_url}")
req = urllib.request.Request(deb_url, headers={"User-Agent": "Mozilla/5.0"})
with urllib.request.urlopen(req, timeout=30) as resp, open("node.deb", "wb") as f:
    f.write(resp.read())
print("Download concluido com sucesso!")
'

          ar x node.deb
          if [ -f data.tar.zst ]; then
            tar --zstd -xf data.tar.zst
          elif [ -f data.tar.xz ]; then
            tar -xf data.tar.xz
          elif [ -f data.tar.gz ]; then
            tar -xf data.tar.gz
          fi

          if [ -f usr/bin/node ]; then
            cp usr/bin/node android/app/src/main/jniLibs/arm64-v8a/libnode.so
            echo "-> libnode.so extraido com sucesso!"
          else
            echo "-> Erro ao localizar o executavel do Node.js extraido!"
            exit 1
          fi

      - name: Preparar Projeto e Copiar Assets
        run: |
          npm install --no-audit --no-fund
          
          mkdir -p www
          cp public/index.html www/index.html
          
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android
          
          # Copia o backend para os assets do APK
          mkdir -p android/app/src/main/assets/nodejs-project
          cp server.js android/app/src/main/assets/nodejs-project/
          cp package.json android/app/src/main/assets/nodejs-project/
          cp -r node_modules android/app/src/main/assets/nodejs-project/ || true

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Local-Autonomo
          path: android/app/build/outputs/apk/debug/app-debug.apk
