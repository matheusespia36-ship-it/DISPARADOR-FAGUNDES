name: Compilar APK Autonomo Local (Node.js Embutido Oficial)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Instalar Dependencias do Projeto
        run: |
          npm install --no-audit --no-fund
          npm install capacitor-nodejs --save
          
          mkdir -p www
          cp public/index.html www/index.html

      - name: Preparar Backend para o App
        run: |
          # O plugin capacitor-nodejs espera que o backend fique nesta pasta:
          mkdir -p nodejs-assets/nodejs-project
          cp server.js package.json nodejs-assets/nodejs-project/
          
          # Instala apenas as bibliotecas de producao no backend
          cd nodejs-assets/nodejs-project
          npm install --production --no-audit --no-fund
          cd ../..

      - name: Gerar Projeto Android
        run: |
          rm -rf android
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

          # Permite comunicação interna HTTP no localhost do celular
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Local-Autonomo
          path: android/app/build/outputs/apk/debug/app-debug.apk
