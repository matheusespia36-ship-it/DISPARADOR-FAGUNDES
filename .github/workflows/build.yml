name: Compilar APK Autonomo Local (Node.js Embutido)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Baixar Binario Node.js ARM64 Nativo para Android
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          
          # Obtem o indice de pacotes do Termux
          curl -sL "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages.xz" | xz -d > Packages
          
          # Localiza o caminho exato do pacote do Node.js
          PKG_PATH=$(grep -A 15 "^Package: nodejs$" Packages | grep "^Filename:" | head -n 1 | awk '{print $2}')
          if [ -z "$PKG_PATH" ]; then
            PKG_PATH=$(grep -A 15 "^Package: nodejs-lts$" Packages | grep "^Filename:" | head -n 1 | awk '{print $2}')
          fi
          
          echo "Baixando pacote: $PKG_PATH"
          curl -L -o node.deb "https://packages-cf.termux.dev/apt/termux-main/${PKG_PATH}"
          
          # Extrai o binario e renomeia para libnode.so
          ar x node.deb
          tar -xf data.tar.xz || tar -xf data.tar.gz
          cp usr/bin/node android/app/src/main/jniLibs/arm64-v8a/libnode.so

      - name: Preparar Projeto e Copiar Assets
        run: |
          npm install --no-audit --no-fund
          
          mkdir -p www
          cp public/index.html www/index.html
          
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android
          
          # Copia o backend para os assets do APK
          mkdir -p android/app/src/main/assets/nodejs-project
          cp server.js android/app/src/main/assets/nodejs-project/
          cp package.json android/app/src/main/assets/nodejs-project/
          cp -r node_modules android/app/src/main/assets/nodejs-project/ || true

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Local-Autonomo
          path: android/app/build/outputs/apk/debug/app-debug.apk
