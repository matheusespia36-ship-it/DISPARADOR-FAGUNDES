name: Compilar APK Autonomo Local (Node.js Embutido)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Baixar Binario Node.js ARM64 Nativo para Android
        run: |
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          sudo apt-get update && sudo apt-get install -y zstd binutils curl
          
          # Baixa indice de pacotes em texto puro
          curl -sL -A "Mozilla/5.0" "https://packages-cf.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages" -o Packages || true
          
          if [ ! -s Packages ]; then
            curl -sL -A "Mozilla/5.0" "https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-aarch64/Packages" -o Packages || true
          fi

          PKG_PATH=$(grep -A 15 "^Package: nodejs$" Packages | grep "^Filename:" | head -n 1 | awk '{print $2}')
          if [ -z "$PKG_PATH" ]; then
            PKG_PATH=$(grep -A 15 "^Package: nodejs-lts$" Packages | grep "^Filename:" | head -n 1 | awk '{print $2}')
          fi

          echo "Caminho do pacote: $PKG_PATH"

          if [ -n "$PKG_PATH" ]; then
            curl -sL -A "Mozilla/5.0" -o node.deb "https://packages-cf.termux.dev/apt/termux-main/${PKG_PATH}"
          else
            curl -sL -A "Mozilla/5.0" -o node.deb "https://packages-cf.termux.dev/apt/termux-main/pool/main/n/node/nodejs_20.18.0_aarch64.deb"
          fi

          # Extrai o arquivo .deb (com suporte a zstd e xz)
          ar x node.deb
          tar --zstd -xf data.tar.zst 2>/dev/null || tar -xf data.tar.xz 2>/dev/null || tar -xf data.tar.gz 2>/dev/null || true

          if [ -f usr/bin/node ]; then
            cp usr/bin/node android/app/src/main/jniLibs/arm64-v8a/libnode.so
            echo "-> libnode.so extraido com sucesso!"
          else
            echo "-> Erro ao localizar o executavel do Node.js extraido!"
            exit 1
          fi

      - name: Preparar Projeto e Copiar Assets
        run: |
          npm install --no-audit --no-fund
          
          mkdir -p www
          cp public/index.html www/index.html
          
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android
          
          # Copia o backend para os assets do APK
          mkdir -p android/app/src/main/assets/nodejs-project
          cp server.js android/app/src/main/assets/nodejs-project/
          cp package.json android/app/src/main/assets/nodejs-project/
          cp -r node_modules android/app/src/main/assets/nodejs-project/ || true

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Local-Autonomo
          path: android/app/build/outputs/apk/debug/app-debug.apk
