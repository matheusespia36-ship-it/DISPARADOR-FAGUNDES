name: Compilar APK Autonomo Local (Node.js Embutido)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Baixar Binario Oficial Termux ARM64 Nativo
        run: |
          sudo apt-get update && sudo apt-get install -y zstd binutils zip
          mkdir -p lib_node_temp
          # Faz download direto do espelho oficial do pacote nodejs estável para aarch64
          wget https://leaseweb.com -O node.deb || \
          wget https://termux.dev -O node.deb
          
          ar x node.deb
          tar --zstd -xf data.tar.zst || tar -xf data.tar.xz || tar -xf data.tar.gz
          
          NODE_BIN=$(find . -type f -name "node" | head -n 1)
          if [ -n "$NODE_BIN" ]; then
            cp "$NODE_BIN" lib_node_temp/libnode.so
          else
            echo "Falha ao extrair binario real" && exit 1
          fi

      - name: Preparar Projeto e Sincronizar Assets
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp public/index.html www/index.html

          # Remove pasta antiga e inicializa o Capacitor localmente
          npm install @capacitor/core@6.0.0 @capacitor/android@6.0.0 @capacitor/cli@6.0.0 --save
          rm -rf android
          npx capacitor add android
          npx capacitor sync android

          # Garante a injeção do motor nativo real no APK
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp lib_node_temp/libnode.so android/app/src/main/jniLibs/arm64-v8a/

          # Move os ficheiros do backend descompactados diretamente para a pasta de assets nativos
          mkdir -p android/app/src/main/assets/nodejs-project/public
          cp server.js package.json android/app/src/main/assets/nodejs-project/
          cp -r node_modules android/app/src/main/assets/nodejs-project/
          cp public/index.html android/app/src/main/assets/nodejs-project/public/

          sed -i 's/<application/<application android:usesCleartextTraffic="true" android:extractNativeLibs="true" /' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Local-Autonomo
          path: android/app/build/outputs/apk/debug/app-debug.apk
