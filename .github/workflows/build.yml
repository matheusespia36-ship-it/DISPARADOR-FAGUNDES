name: Compilar APK Android Autônomo

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Baixar Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Instalar Dependências e Módulos
        run: |
          npm install --no-audit --no-fund
          npm install capacitor-nodejs @capacitor/core @capacitor/cli @capacitor/android --no-audit --no-fund
          
          if [ -d "public/nodejs" ]; then
            cd public/nodejs
            npm install --production --no-audit --no-fund
            cd ../..
          fi

          mkdir -p www
          cp public/index.html www/index.html
          if [ -d "public/nodejs" ]; then
            cp -r public/nodejs www/nodejs
          fi
          
          npx @capacitor/cli add android || true
          npx @capacitor/cli sync android
          
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/g' android/app/src/main/AndroidManifest.xml || true

      - name: Corrigir conflito de duplicidade Kotlin
        run: |
          cat << 'GROOVY' >> android/app/build.gradle

          configurations.all {
              resolutionStrategy.eachDependency { details ->
                  if (details.requested.group == 'org.jetbrains.kotlin' && (details.requested.name == 'kotlin-stdlib-jdk7' || details.requested.name == 'kotlin-stdlib-jdk8')) {
                      details.useVersion '1.8.22'
                  }
              }
          }
          GROOVY

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Autonomo
          path: android/app/build/outputs/apk/debug/app-debug.apk
