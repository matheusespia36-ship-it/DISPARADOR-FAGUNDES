name: Compilar APK Autonomo Local (Node.js Embutido)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar Codigo
        uses: actions/checkout@v4

      - name: Configurar Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Baixar Binario Node.js ARM64 Nativo
        run: |
          sudo apt-get update && sudo apt-get install -y zstd binutils python3
          python3 scripts/download_node.py
          
          ar x node.deb
          if [ -f data.tar.zst ]; then tar --zstd -xf data.tar.zst; fi
          if [ -f data.tar.xz ]; then tar -xf data.tar.xz; fi
          if [ -f data.tar.gz ]; then tar -xf data.tar.gz; fi
          
          NODE_BIN=$(find . -type f -name "node" | head -n 1)
          if [ -n "$NODE_BIN" ]; then
            mkdir -p lib_node_temp
            cp "$NODE_BIN" lib_node_temp/libnode.so
            echo "-> Node.js extraido com sucesso!"
          else
            echo "-> Erro ao localizar o executavel do Node.js!"
            exit 1
          fi

      - name: Preparar Projeto Android
        run: |
          npm install --no-audit --no-fund
          mkdir -p www
          cp public/index.html www/index.html

          rm -rf android
          npx @capacitor/cli add android
          npx @capacitor/cli sync android

          # Copia a biblioteca nativa libnode.so
          mkdir -p android/app/src/main/jniLibs/arm64-v8a
          cp lib_node_temp/libnode.so android/app/src/main/jniLibs/arm64-v8a/

          # Copia o backend para os assets do APK
          mkdir -p android/app/src/main/assets/nodejs-project
          cp server.js android/app/src/main/assets/nodejs-project/
          cp package.json android/app/src/main/assets/nodejs-project/
          cp -r node_modules android/app/src/main/assets/nodejs-project/ || true

          # Configura MainActivity com extrator de assets completo
          PACKAGE_PATH="android/app/src/main/java/com/disparador/app"
          mkdir -p "$PACKAGE_PATH"
          cat << 'JAVA' > "$PACKAGE_PATH/MainActivity.java"
          package com.disparador.app;

          import android.os.Bundle;
          import android.content.Context;
          import com.getcapacitor.BridgeActivity;
          import java.io.*;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  iniciarNodeJSInternal();
              }

              private void iniciarNodeJSInternal() {
                  new Thread(() -> {
                      try {
                          Context context = getApplicationContext();
                          File filesDir = context.getFilesDir();
                          File nodeDir = new File(filesDir, "nodejs-project");

                          // Extrai arquivos do backend para a memoria do app
                          copiarAssetsRecursivo(context, "nodejs-project", nodeDir);

                          String nodeBinary = context.getApplicationInfo().nativeLibraryDir + "/libnode.so";
                          File serverFile = new File(nodeDir, "server.js");

                          if (new File(nodeBinary).exists() && serverFile.exists()) {
                              ProcessBuilder pb = new ProcessBuilder(nodeBinary, serverFile.getAbsolutePath());
                              pb.directory(nodeDir);
                              pb.environment().put("PORT", "3000");
                              pb.environment().put("HOME", filesDir.getAbsolutePath());
                              pb.start();
                          }
                      } catch (Exception e) {
                          e.printStackTrace();
                      }
                  }).start();
              }

              private void copiarAssetsRecursivo(Context context, String path, File targetDir) {
                  try {
                      String[] files = context.getAssets().list(path);
                      if (files != null && files.length > 0) {
                          targetDir.mkdirs();
                          for (String file : files) {
                              String subPath = path.isEmpty() ? file : path + "/" + file;
                              copiarAssetsRecursivo(context, subPath, new File(targetDir, file));
                          }
                      } else {
                          InputStream in = context.getAssets().open(path);
                          OutputStream out = new FileOutputStream(targetDir);
                          byte[] buffer = new byte[4096];
                          int read;
                          while ((read = in.read(buffer)) != -1) {
                              out.write(buffer, 0, read);
                          }
                          in.close();
                          out.flush();
                          out.close();
                      }
                  } catch (Exception ignored) {}
              }
          }
          JAVA

          # Permite trafego HTTP local
          sed -i 's/<application/<application android:usesCleartextTraffic="true"/' android/app/src/main/AndroidManifest.xml

      - name: Compilar APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Disponibilizar APK para Download
        uses: actions/upload-artifact@v4
        with:
          name: Disparador-WhatsApp-Local-Autonomo
          path: android/app/build/outputs/apk/debug/app-debug.apk
